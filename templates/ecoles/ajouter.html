<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Établissement</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 style="color: white;">➕ Nouvel Établissement</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nom de l'établissement *</label>
                                <input type="text" class="form-control" name="nom" required placeholder="Ex: Université de Cocody">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Type d'établissement</label>
                                <input type="text" class="form-control" name="type_etablissement" placeholder="Ex: Université, IUT, École">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ville</label>
                                <input type="text" class="form-control" name="ville" placeholder="Ex: Abidjan">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Contact</label>
                                <input type="text" class="form-control" name="contact" placeholder="Ex: M. Dupont">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Téléphone</label>
                                <input type="text" class="form-control" name="telephone" placeholder="Ex: +225 01 02 03 04 05">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" name="email" placeholder="Ex: contact@universite.ci">
                            </div>
                            <div class="d-flex gap-2 justify-content-center">
                                <button type="submit" class="btn btn-success">💾 Enregistrer</button>
                                <a href="/ecoles" class="btn btn-outline-secondary">← Retour</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
