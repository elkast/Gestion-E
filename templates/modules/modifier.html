<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un Module</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="/">Gestion Enseignement</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/">Tableau de Bord</a>
                    <a class="nav-link" href="/ajouter-module">Nouveau Module</a>
                    <a class="nav-link" href="/ecoles">Établissements</a>
                </div>
            </div>
        </nav>

        <div class="card mt-4">
            <div class="card-header">
                <h5 style="color: white;">Modifier le Module</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nom du Module</label>
                            <input type="text" name="nom_module" class="form-control" value="{{ module.nom_module }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Établissement</label>
                            <select name="ecole_id" class="form-select" required>
                                {% for ecole in ecoles %}
                                <option value="{{ ecole.id }}" {% if ecole.id == module.ecole_id %}selected{% endif %}>{{ ecole.nom }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Niveau</label>
                            <select name="niveau" class="form-select" required>
                                <option value="Licence 1" {% if module.niveau == 'Licence 1' %}selected{% endif %}>Licence 1</option>
                                <option value="Licence 2" {% if module.niveau == 'Licence 2' %}selected{% endif %}>Licence 2</option>
                                <option value="Licence 3" {% if module.niveau == 'Licence 3' %}selected{% endif %}>Licence 3</option>
                                <option value="Master 1" {% if module.niveau == 'Master 1' %}selected{% endif %}>Master 1</option>
                                <option value="Master 2" {% if module.niveau == 'Master 2' %}selected{% endif %}>Master 2</option>
                                <option value="Doctorat" {% if module.niveau == 'Doctorat' %}selected{% endif %}>Doctorat</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Année Universitaire</label>
                            <input type="text" name="annee_universitaire" class="form-control" value="{{ module.annee_universitaire }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Volume CM (heures)</label>
                            <input type="number" step="0.01" name="volume_cm" class="form-control" value="{{ module.volume_cm }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Volume TD (heures)</label>
                            <input type="number" step="0.01" name="volume_td" class="form-control" value="{{ module.volume_td }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Volume TP (heures)</label>
                            <input type="number" step="0.01" name="volume_tp" class="form-control" value="{{ module.volume_tp }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Tarif CM (FCFA/h)</label>
                            <input type="number" step="0.01" name="tarif_cm" class="form-control" value="{{ module.tarif_cm }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Tarif TD (FCFA/h)</label>
                            <input type="number" step="0.01" name="tarif_td" class="form-control" value="{{ module.tarif_td }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Tarif TP (FCFA/h)</label>
                            <input type="number" step="0.01" name="tarif_tp" class="form-control" value="{{ module.tarif_tp }}">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a href="/" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
